# RIMES iOS original minimal schema (MIT). No desktop includes or Lua.
schema:
  schema_id: rimes_ziranma
  name: RIMES ziranma
  version: "0.1.0"
switches:
  - name: ascii_mode
    reset: 0
engine:
  processors: [ascii_composer, speller, punctuator, selector, navigator, express_editor]
  segmentors: [ascii_segmentor, abc_segmentor, punct_segmentor, fallback_segmentor]
  translators: [punct_translator, script_translator]
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
  algebra: ["erase/^xx$/", "derive/^([jqxy])u$/$1v/", "derive/^([aoe])([ioun])$/$1$1$2/", "xform/^([aoe])(ng)?$/$1$1$2/", "xform/iu$/Ⓠ/", "xform/[iu]a$/Ⓦ/", "xform/[uv]an$/Ⓡ/", "xform/[uv]e$/Ⓣ/", "xform/ing$|uai$/Ⓨ/", "xform/^sh/Ⓤ/", "xform/^ch/Ⓘ/", "xform/^zh/Ⓥ/", "xform/uo$/Ⓞ/", "xform/[uv]n$/Ⓟ/", "xform/(.)i?ong$/$1Ⓢ/", "xform/[iu]ang$/Ⓓ/", "xform/(.)en$/$1Ⓕ/", "xform/(.)eng$/$1Ⓖ/", "xform/(.)ang$/$1Ⓗ/", "xform/ian$/Ⓜ/", "xform/(.)an$/$1Ⓙ/", "xform/iao$/Ⓒ/", "xform/(.)ao$/$1Ⓚ/", "xform/(.)ai$/$1Ⓛ/", "xform/(.)ei$/$1Ⓩ/", "xform/ie$/Ⓧ/", "xform/ui$/Ⓥ/", "xform/(.)ou$/$1Ⓑ/", "xform/in$/Ⓝ/", "xlit/ⓆⓌⓇⓉⓎⓊⒾⓄⓅⓈⒹⒻⒼⒽⓂⒿⒸⓀⓁⓏⓍⓋⒷⓃ/qwrtyuiopsdfghmjcklzxvbn/"]
translator:
  dictionary: pinyin_simp
  prism: rimes_ziranma
  enable_user_dict: true
  enable_sentence: true
  enable_completion: true
  preedit_format: ["xform/(^|[ '])aa/$1a/", "xform/(^|[ '])ee/$1e/", "xform/(^|[ '])oo/$1o/", "xform/([bpmnljqxy])n/$1in/", "xform/(\\w)g/$1eng/", "xform/(\\w)q/$1iu/", "xform/([gkhvuirzcs])w/$1ua/", "xform/(\\w)w/$1ia/", "xform/([dtnlgkhjqxyvuirzcs])r/$1uan/", "xform/(\\w)t/$1ve/", "xform/([gkhvuirzcs])y/$1uai/", "xform/(\\w)y/$1ing/", "xform/([dtnlgkhvuirzcs])o/$1uo/", "xform/(\\w)p/$1un/", "xform/([jqx])s/$1iong/", "xform/(\\w)s/$1ong/", "xform/([jqxnlb])d/$1iang/", "xform/(\\w)d/$1uang/", "xform/(\\w)f/$1en/", "xform/(\\w)h/$1ang/", "xform/(\\w)j/$1an/", "xform/(\\w)k/$1ao/", "xform/(\\w)l/$1ai/", "xform/(\\w)z/$1ei/", "xform/(\\w)x/$1ie/", "xform/(\\w)c/$1iao/", "xform/([dtgkhvuirzcs])v/$1ui/", "xform/(\\w)b/$1ou/", "xform/(\\w)m/$1ian/", "xform/([aoe])\\1(\\w)/$1$2/", "xform/(^|[ '])v/$1zh/", "xform/(^|[ '])i/$1ch/", "xform/(^|[ '])u/$1sh/", "xform/([jqxy])v/$1u/", "xform/([nl])v/$1ü/", "xform/ü/v/"]
punctuator:
  half_shape:
    ',': '，'
    '.': '。'
    '?': '？'
    '!': '！'
    ':': '：'
    ';': '；'
