# Lua-free fixture using the workbench's default schema ID. This is not the
# product rime_ice schema. Behaviour is the Rime defaults: Space commits the highlight,
# digits select, PageDown pages, Escape cancels.
schema:
  schema_id: rime_ice
  name: RIMES E2E
  version: "0.1"

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - table_translator

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"

translator:
  dictionary: rimes_e2e
  enable_charset_filter: false
  enable_encoder: false
  enable_sentence: false
  enable_user_dict: false
  encode_commit_history: false
  enable_completion: true

menu:
  page_size: 5

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Caps_Lock: clear
    Shift_L: commit_code
    Shift_R: noop
    Control_L: noop
    Control_R: noop

key_binder:
  bindings:
    - {when: has_menu, accept: Page_Up, send: Page_Up}
    - {when: has_menu, accept: Page_Down, send: Page_Down}
    - {when: composing, accept: Escape, send: Escape}
    - {when: has_menu, accept: space, send: space}

recognizer:
  patterns:
    uppercase: ""
