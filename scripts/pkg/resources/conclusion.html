<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { font: -apple-system-body, "Helvetica Neue", sans-serif; color: CanvasText; margin: 12px 16px; line-height: 1.6; }
  h2 { margin: 0 0 8px; color: CanvasText; }
  p { color: CanvasText; }
  ol { margin: 6px 0 6px 20px; padding: 0; }
  li { margin: 4px 0; color: CanvasText; }
  b { color: CanvasText; }
  .tip { background: rgba(255,179,0,0.14); border-left: 3px solid #ffb300; padding: 8px 12px; border-radius: 4px; margin-top: 12px; }
</style></head>
<body>
  <h2>安装完成</h2>
  <p>「RIMES」程序文件已安装。若安装时存在普通 GUI 用户会话，安装器已在该会话中尝试注册、启用并切换；若已安排登录重试，后续登录会自动继续处理。</p>
  <p>如果输入菜单暂时没刷新：</p>
  <ol>
    <li><b>注销当前账户并重新登录</b>，让 macOS 重建当前用户的输入源状态</li>
    <li>打开<b>系统设置 → 键盘 → 文本输入 → 输入法</b>，点<b>「编辑…」</b>或 <b>+</b></li>
    <li>左侧选<b>「简体中文」</b>，右侧勾选/添加<b>「RIMES」</b></li>
    <li>再用输入菜单或 <b>Ctrl-Space</b> 切换到它</li>
  </ol>
  <div class="tip">
    <b>这不代表安装失败。</b> 新版 macOS 有时不会在当前登录会话里及时显示新输入源；不要手动结束系统的输入法进程。
  </div>
</body></html>
