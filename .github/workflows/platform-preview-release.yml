name: Release Windows and Linux Input-Schemes Preview

on:
  push:
    tags:
      - 'platform-preview-v*'

permissions:
  contents: read

jobs:
  windows-package:
    name: Build and test Windows preview
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Resolve preview version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^platform-preview-v', ''
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:[-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid platform preview tag: $env:GITHUB_REF_NAME"
          }
          "PREVIEW_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify shared data policy
        run: python scripts/platform-preview/preview.py verify --repo-root .

      - name: Exercise Windows package transactions
        shell: pwsh
        run: platforms/windows/tests/Smoke-RimesDataPreview.ps1

      - name: Build Windows release ZIP
        shell: pwsh
        run: >-
          platforms/windows/scripts/New-RimesDataPreviewPackage.ps1
          -Version $env:PREVIEW_VERSION
          -OutputDirectory "$env:RUNNER_TEMP/rimes-preview-out"

      - name: Reopen and verify the exact Windows release assets
        shell: pwsh
        run: >-
          python scripts/platform-preview/verify_release_assets.py
          --repo-root .
          --asset-dir "$env:RUNNER_TEMP/rimes-preview-out"
          --version $env:PREVIEW_VERSION
          --platform windows

      - name: Upload Windows release assets
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: RIMES-platform-preview-windows
          path: ${{ runner.temp }}/rimes-preview-out/*
          if-no-files-found: error
          compression-level: 0

  linux-package:
    name: Build and test Linux preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Resolve preview version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#platform-preview-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid platform preview tag: $GITHUB_REF_NAME" >&2
            exit 1
          }
          echo "PREVIEW_VERSION=$version" >> "$GITHUB_ENV"

      - name: Verify shared data policy
        run: python3 scripts/platform-preview/preview.py verify --repo-root .

      - name: Exercise Linux package transactions
        run: platforms/linux/tests/smoke.sh

      - name: Build Linux release archive
        run: >-
          platforms/linux/scripts/package.sh
          --version "$PREVIEW_VERSION"
          --output-dir "$RUNNER_TEMP/rimes-preview-out"

      - name: Reopen and verify the exact Linux release assets
        run: >-
          python3 scripts/platform-preview/verify_release_assets.py
          --repo-root .
          --asset-dir "$RUNNER_TEMP/rimes-preview-out"
          --version "$PREVIEW_VERSION"
          --platform linux

      - name: Upload Linux release assets
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: RIMES-platform-preview-linux
          path: ${{ runner.temp }}/rimes-preview-out/*
          if-no-files-found: error
          compression-level: 0

  macos-regression:
    name: Keep the macOS target healthy
    # macOS 15 currently defaults to Xcode 16.4 / Swift 6.1, which is required
    # by the pinned GRDB 7.11.1 dependency. This remains an unmodified build of
    # the existing macOS target; the preview contributes no AppKit/IMK source.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build existing macOS target
        run: swift build

      - name: Run platform-neutral macOS smoke harnesses
        run: |
          BIN="$(swift build --show-bin-path)/RimeBuffer"
          ROOT="$RUNNER_TEMP/rimes-platform-preview-mac"
          mkdir -p "$ROOT/profile" "$ROOT/local" "$ROOT/plugins"
          export RIMEBUFFER_USER_DIR="$ROOT/profile"
          export RIMEBUFFER_LOCAL_DATA_ROOT="$ROOT/local"
          export RIMEBUFFER_PLUGIN_ROOT="$ROOT/plugins"
          "$BIN" schema-smoke
          "$BIN" buffer-smoke
          "$BIN" buffer-window-smoke

  release:
    name: Publish prerelease
    if: startsWith(github.ref, 'refs/tags/platform-preview-v')
    needs: [windows-package, linux-package, macos-regression]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the tagged verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download platform assets
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: RIMES-platform-preview-*
          path: release-assets
          merge-multiple: true

      - name: Reopen and verify the exact release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#platform-preview-v}"
          python3 scripts/platform-preview/verify_release_assets.py \
            --repo-root . \
            --asset-dir release-assets \
            --version "$version" \
            --platform all

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#platform-preview-v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace assets: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            "release-assets/RIMES-Windows-Data-Preview-$version.zip" \
            "release-assets/RIMES-Windows-Data-Preview-$version.zip.sha256" \
            "release-assets/RIMES-Linux-Data-Preview-$version.tar.gz" \
            "release-assets/RIMES-Linux-Data-Preview-$version.tar.gz.sha256" \
            --verify-tag \
            --prerelease \
            --latest=false \
            --title "RIMES Windows/Linux Input-Schemes Preview $version" \
            --notes-file - <<'EOF'
          ## RIMES Windows / Linux Data & Input-Schemes Preview

          这是实验性的数据兼容预览，不是完整的 Windows 或 Linux 原生 RIMES。

          - Windows 包需要先安装官方 Weasel。
          - Linux 包需要先安装 Fcitx5 Rime 或 IBus Rime。
          - 包含四套 Rime 方案、词库、审核过的 Lua/OpenCC 数据与同批并击配置。
          - 不包含缓冲工作台、AI/翻译/OCR、RIMES 原生设置 UI 或跨批互击前端。
          - 安装器不会写入 `build/`、userdb 或学习词库；配置冲突默认停止。

          请下载与平台对应的资产，并先阅读包内 README。该版本尚未完成真实
          Windows/Linux 桌面打字验收，问题请附平台、前端版本、桌面环境及部署日志。
          EOF
