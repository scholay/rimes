name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # GRDB 7.11.1 declares swift-tools-version 6.1. macOS 15 runners provide
    # a compatible Xcode toolchain while preserving the existing macOS build.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Swift version
        run: swift --version

      # Catch malformed input-source/package metadata before the release-only
      # workflow tries to assemble an installer.
      - name: Validate installer metadata
        run: |
          plutil -lint Info.plist
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Info.plist)
          PARENT_ID=$(/usr/libexec/PlistBuddy -c 'Print :TISInputSourceID' Info.plist)
          MODE_ID=$(/usr/libexec/PlistBuddy -c 'Print :ComponentInputModeDict:tsVisibleInputModeOrderedArrayKey:0' Info.plist)
          DECLARED_MODE_ID=$(/usr/libexec/PlistBuddy -c "Print :ComponentInputModeDict:tsInputModeListKey:${MODE_ID}:TISInputSourceID" Info.plist)
          CONNECTION=$(/usr/libexec/PlistBuddy -c 'Print :InputMethodConnectionName' Info.plist)
          DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' Info.plist)
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' Info.plist)
          MENU_TITLE=$(/usr/libexec/PlistBuddy -c "Print :ComponentInputModeDict:tsInputModeListKey:${MODE_ID}:tsInputModeAlternateMenuTitleKey" Info.plist)
          CHILD_REPERTOIRE=$(/usr/libexec/PlistBuddy -c "Print :ComponentInputModeDict:tsInputModeListKey:${MODE_ID}:tsInputModeCharacterRepertoireKey" Info.plist | tr -d '[:space:]')
          test "$PARENT_ID" = "$BUNDLE_ID"
          test "$PARENT_ID" != "$MODE_ID"
          test "$MODE_ID" = "$DECLARED_MODE_ID"
          test "$CONNECTION" = 'RimeBuffer_1_Connection'
          test "$DISPLAY_NAME" = 'RIMES'
          test "$MENU_TITLE" = 'RIMES'
          test "$EXECUTABLE" = 'ETInput'
          test "$CHILD_REPERTOIRE" = 'Array{HansHant}'
          # Freeze the input-source identity to exact literals. The structure
          # checks above still pass if the whole trio is renamed together, but
          # macOS burns these ids into the protected TIS preferences: any drift
          # orphans the old rows and stacks duplicate "RIMES" entries in
          # System Settings (this bit us across the 0.3–0.4 renames — see
          # RELEASE.md). Never change these without a migration story.
          test "$BUNDLE_ID" = 'com.isaac.inputmethod.RimeBuffer'
          test "$MODE_ID" = 'com.isaac.inputmethod.RimeBuffer.Hans'
          test "$MODE_ID" = "${BUNDLE_ID}.Hans"
          if /usr/libexec/PlistBuddy -c 'Print :tsInputMethodCharacterRepertoireKey' Info.plist >/dev/null 2>&1; then
            echo 'Parent input method must not declare a repertoire; only the Hans child mode does.'
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c "Print :ComponentInputModeDict:tsInputModeListKey:${MODE_ID}:tsInputModeKeyEquivalentKey" Info.plist >/dev/null 2>&1; then
            echo 'Do not declare an empty/per-mode key equivalent; global input-source shortcuts are owned by macOS.'
            exit 1
          fi
          xmllint --noout scripts/pkg/distribution.xml
          plutil -lint scripts/pkg/component.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :0:RootRelativeBundlePath' scripts/pkg/component.plist)" = 'ETInput.app'
          test "$(/usr/libexec/PlistBuddy -c 'Print :0:BundleIsRelocatable' scripts/pkg/component.plist)" = 'false'
          test "$(/usr/libexec/PlistBuddy -c 'Print :0:BundleHasStrictIdentifier' scripts/pkg/component.plist)" = 'false'
          test "$(/usr/libexec/PlistBuddy -c 'Print :0:BundleIsVersionChecked' scripts/pkg/component.plist)" = 'true'
          test "$(/usr/libexec/PlistBuddy -c 'Print :0:BundleOverwriteAction' scripts/pkg/component.plist)" = 'upgrade'
          for STRINGS in Resources/*.lproj/InfoPlist.strings; do
            plutil -lint "$STRINGS"
            for KEY in CFBundleDisplayName CFBundleName "$BUNDLE_ID" "$MODE_ID"; do
              test "$(/usr/libexec/PlistBuddy -c "Print :$KEY" "$STRINGS")" = 'RIMES'
            done
          done
          bash -n Logo/generate.sh
          bash -n build_install.sh
          bash -n scripts/lib/rime-user-state.sh
          bash -n scripts/test-rime-user-state.sh
          bash -n scripts/make-pkg.sh
          bash -n scripts/fetch-rime.sh
          bash -n scripts/release.sh
          bash -n scripts/pkg/scripts/rimes-install-common.sh
          bash -n scripts/pkg/scripts/rimes-user-activation-agent.sh
          bash -n scripts/pkg/scripts/preinstall
          bash -n scripts/pkg/scripts/postinstall
          if /usr/bin/grep -REn 'killall[[:space:]]+(imklaunchagent|TextInputMenuAgent)' \
              build_install.sh scripts/pkg/scripts Sources/RimeBuffer/UpdateManager.swift; then
            echo 'Do not restart Apple-owned input-method agents during install/update' >&2
            exit 1
          fi
          if /usr/bin/grep -REn 'rimebuffer-install\.log' scripts/pkg/scripts; then
            echo 'Installer must not open a user-controlled log path as root' >&2
            exit 1
          fi
          if /usr/bin/grep -REn '^[[:space:]]*uses:[[:space:]]*[^@]+@v[0-9]' .github/workflows; then
            echo 'GitHub Actions must be pinned to full commit SHAs' >&2
            exit 1
          fi

          helper_probe="$(mktemp -d /tmp/rimes-helper-ci.XXXXXX)"
          clang -std=c11 -Wall -Wextra -Werror -mmacosx-version-min=13.0 \
            scripts/pkg/helpers/rimes-timeout.c \
            -o "$helper_probe/rimes-timeout"
          clang -std=c11 -Wall -Wextra -Werror -mmacosx-version-min=13.0 \
            -framework Carbon -framework CoreFoundation \
            scripts/pkg/helpers/rimes-update-handoff.c \
            -o "$helper_probe/rimes-update-handoff"
          set +e
          "$helper_probe/rimes-timeout" 1 /bin/sh -c \
            'trap "" TERM; /bin/sleep 37.321 & wait'
          timeout_status=$?
          set -e
          test "$timeout_status" -eq 124
          if pgrep -f '(^|/)sleep 37[.]321$' >/dev/null; then
            echo 'rimes-timeout orphaned a descendant process' >&2
            exit 1
          fi
          python3 - "$helper_probe/rimes-timeout" <<'PY'
          import subprocess
          import sys
          import time

          helper = sys.argv[1]
          started = time.monotonic()
          result = subprocess.run(
              [helper, "2", "/bin/sh", "-c", "/bin/sleep 43.917 &"],
              capture_output=True,
              check=False,
              timeout=3,
          )
          elapsed = time.monotonic() - started
          assert result.returncode == 0, result
          assert elapsed < 2, elapsed
          PY
          if pgrep -f '(^|/)sleep 43[.]917$' >/dev/null; then
            echo 'rimes-timeout retained a leader-less descendant' >&2
            exit 1
          fi
          lock_path="$helper_probe/repair.lock"
          "$helper_probe/rimes-timeout" --lock "$lock_path" 5 \
            /bin/sleep 1 &
          lock_holder=$!
          /bin/sleep 0.1
          set +e
          "$helper_probe/rimes-timeout" --lock "$lock_path" 2 /usr/bin/true
          lock_status=$?
          set -e
          test "$lock_status" -eq 75
          wait "$lock_holder"
          "$helper_probe/rimes-timeout" --lock "$lock_path" 2 /usr/bin/true
          test "$([ -f "$lock_path" ] && stat -f '%Lp' "$lock_path")" = '600'
          set +e
          "$helper_probe/rimes-timeout" 1 \
            "$helper_probe/rimes-timeout" --lock-exec \
            "$helper_probe/outer-owned.lock" /bin/sh -c \
            'trap "" TERM; /bin/sleep 47.321 & wait'
          lock_exec_status=$?
          set -e
          test "$lock_exec_status" -eq 124
          if pgrep -f '(^|/)sleep 47[.]321$' >/dev/null; then
            echo 'outer timeout failed to terminate lock-exec descendants' >&2
            exit 1
          fi
          test "$("$helper_probe/rimes-timeout" --monotonic)" -gt 0

          agent_probe="$(mktemp -d /tmp/rimes-agent-ci.XXXXXX)"
          "$helper_probe/rimes-timeout" 15 /usr/bin/env \
            HOME="$agent_probe" \
            RIMES_TIMEOUT_HELPER="$helper_probe/rimes-timeout" \
            RIMES_OUTER_WATCHDOG=1 /bin/bash \
            scripts/pkg/scripts/rimes-user-activation-agent.sh install
          agent_plist="$agent_probe/Library/LaunchAgents/com.scholay.rimes.activation-repair.plist"
          marker="$agent_probe/Library/Application Support/RIMES/input-source-activation-pending"
          repair_lock="$agent_probe/Library/Application Support/RIMES/input-source-activation-repair.lock"
          plutil -lint "$agent_plist"
          test "$([ -f "$marker" ] && stat -f '%Lp' "$marker")" = '600'
          case "$(cat "$marker")" in
            v1:activation:*) ;;
            *) echo 'activation marker has no generation token' >&2; exit 1 ;;
          esac
          test "$([ -f "$agent_plist" ] && stat -f '%Lp' "$agent_plist")" = '600'
          test "$([ -f "$repair_lock" ] && stat -f '%Lp' "$repair_lock")" = '600'
          test "$(/usr/libexec/PlistBuddy -c 'Print :ProgramArguments:0' "$agent_plist")" = '/Library/Input Methods/ETInput.app/Contents/MacOS/ETInput'
          test "$(/usr/libexec/PlistBuddy -c 'Print :ProgramArguments:1' "$agent_plist")" = '--repair-pending-install'

          # A repair briefly holding the snapshot lock must not make a newer,
          # stronger duplicate generation disappear. The publisher retries in
          # the same outer watchdog group, and ordinary activation cannot
          # downgrade an existing duplicate-conflict marker.
          "$helper_probe/rimes-timeout" --lock "$repair_lock" 5 \
            /bin/sleep 1 &
          repair_lock_holder=$!
          /bin/sleep 0.1
          "$helper_probe/rimes-timeout" 15 /usr/bin/env \
            HOME="$agent_probe" \
            RIMES_TIMEOUT_HELPER="$helper_probe/rimes-timeout" \
            RIMES_OUTER_WATCHDOG=1 /bin/bash \
            scripts/pkg/scripts/rimes-user-activation-agent.sh \
            install duplicate-conflict
          wait "$repair_lock_holder"
          case "$(cat "$marker")" in
            v1:duplicate-conflict:*) ;;
            *) echo 'strong marker generation was not committed' >&2; exit 1 ;;
          esac
          "$helper_probe/rimes-timeout" 15 /usr/bin/env \
            HOME="$agent_probe" \
            RIMES_TIMEOUT_HELPER="$helper_probe/rimes-timeout" \
            RIMES_OUTER_WATCHDOG=1 /bin/bash \
            scripts/pkg/scripts/rimes-user-activation-agent.sh install activation
          case "$(cat "$marker")" in
            v1:duplicate-conflict:*) ;;
            *) echo 'activation downgraded a duplicate marker' >&2; exit 1 ;;
          esac
          "$helper_probe/rimes-timeout" 15 /usr/bin/env \
            HOME="$agent_probe" \
            RIMES_TIMEOUT_HELPER="$helper_probe/rimes-timeout" \
            RIMES_OUTER_WATCHDOG=1 /bin/bash \
            scripts/pkg/scripts/rimes-user-activation-agent.sh remove
          test ! -e "$marker"
          test ! -e "$agent_plist"
          test -f "$repair_lock"
          find "$agent_probe" -depth -delete
          find "$helper_probe" -depth -delete

      - name: Preserve durable user state across reseed
        run: scripts/test-rime-user-state.sh

      - name: Verify preset buffer plug-in catalog and README
        run: python3 -B scripts/sync-buffer-plugin-catalog.py --check

      # Privacy: the log must never carry user-entered/committed text. The
      # scanner follows multiline/raw strings and nested interpolation, while
      # allowing only explicitly redacted values and known-safe metadata.
      - name: No plaintext in logs
        run: python3 scripts/lint-log-privacy.py

      - name: Marine Chrome extension smoke
        run: node Extensions/marine-chrome/tests/smoke.mjs

      # librime is dlopen'd at runtime (see CRimeBridge.cpp), so the build has no
      # link-time dependency on Squirrel — a stock runner compiles it cleanly.
      - name: Build (debug)
        run: swift build

      # These smoke harnesses exercise local models/config stores only and
      # exit before the IMK/librime bootstrap, so they run without Squirrel.
      - name: Smoke tests
        run: |
          BIN="$(swift build --show-bin-path)/RimeBuffer"
          ROOT="$RUNNER_TEMP/rimebuffer-smoke"
          mkdir -p "$ROOT/profile" "$ROOT/local" "$ROOT/plugins"
          export RIMEBUFFER_USER_DIR="$ROOT/profile"
          export RIMEBUFFER_LOCAL_DATA_ROOT="$ROOT/local"
          export RIMEBUFFER_PLUGIN_ROOT="$ROOT/plugins"

          SMOKES=(
            schema-smoke
            buffer-smoke
            buffer-window-smoke
            stats-smoke
            matrix-smoke
            candidate-metrics-smoke
            activation-cache-smoke
            theme-smoke
            theme-appkit-smoke
            input-source-install-smoke
            update-package-metadata-smoke
            origin-smoke
            inbound-smoke
            marine-chrome-smoke
            plugin-smoke
            plugin-stream-smoke
            plugin-platform-smoke
            plugin-distribution-smoke
            plugin-configuration-smoke
            translation-smoke
            ai-text-smoke
            stream-input-smoke
            my-prompt-smoke
            remarkable-plugin-smoke
            settings-routing-smoke
            history-heatmap-smoke
            typing-speed-smoke
            fly-chord-learning-smoke
            input-telemetry-smoke
            user-lexicon-smoke
            remote-smoke
          )
          for smoke in "${SMOKES[@]}"; do
            echo "::group::$smoke"
            if "$BIN" "$smoke"; then
              echo "::endgroup::"
            else
              status=$?
              echo "::endgroup::"
              echo "::error title=Smoke test failed::$smoke exited with status $status"
              exit "$status"
            fi
          done

      # Instantiate every core/dynamic AppKit route, render it off-screen, and
      # verify the complete manifest. All writable roots are runner-temporary,
      # so this cannot read a developer's live stats, plugins, token, or userdb.
      - name: Settings assembly render smoke
        run: |
          BIN="$(swift build --show-bin-path)/RimeBuffer"
          ROOT="$RUNNER_TEMP/rimebuffer-settings-render"
          for MODE in night day; do
            OUTPUT="$ROOT/$MODE/output"
            mkdir -p "$OUTPUT" "$ROOT/$MODE/profile" "$ROOT/$MODE/local" "$ROOT/$MODE/plugins"
            RIMEBUFFER_APPEARANCE_MODE="$MODE" \
            RIMEBUFFER_USER_DIR="$ROOT/$MODE/profile" \
            RIMEBUFFER_LOCAL_DATA_ROOT="$ROOT/$MODE/local" \
            RIMEBUFFER_PLUGIN_ROOT="$ROOT/$MODE/plugins" \
              "$BIN" settings-render "$OUTPUT"
            test "$(find "$OUTPUT" -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')" = '22'
            python3 -m json.tool "$OUTPUT/manifest.json" >/dev/null
            ! /usr/bin/grep -Eq 'extension\.apple-translation' "$OUTPUT/manifest.json"
            test "$(sips -g pixelWidth -g pixelHeight "$OUTPUT"/*.png | \
              awk '/pixelWidth:/{w=$2}/pixelHeight:/{print w"x"$2}' | sort -u)" = '1960x1360'
          done
