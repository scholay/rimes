name: iOS development build
on:
  pull_request:
    paths: ['Shared/**', 'platforms/ios/**', 'Sources/RimeBuffer/ChordOutputEncoding.swift', 'chord-keymaps/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build and test without device credentials
        run: platforms/ios/scripts/build.sh
      - name: Assert distribution remains gated until required evidence exists
        run: |
          python3 platforms/ios/scripts/verify.py
          # No upload, signing credentials or artifact publication in this workflow.
