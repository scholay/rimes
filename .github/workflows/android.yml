name: Android checks

on:
  pull_request:
    branches: [main]
    paths: ['OfficialPlugins', 'plugins.lock.json', 'scripts/prepare-official-plugins.py', 'LICENSE', 'platforms/android/**', 'platforms/ios/dependencies.lock.json', 'platforms/ios/Resources/EngineData/**', 'platforms/ios/Licenses/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['OfficialPlugins', 'plugins.lock.json', 'scripts/prepare-official-plugins.py', 'LICENSE', 'platforms/android/**', 'platforms/ios/dependencies.lock.json', 'platforms/ios/Resources/EngineData/**', 'platforms/ios/Licenses/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: platforms/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Prepare pinned official plugin sources
        working-directory: ${{ github.workspace }}
        run: python3 scripts/prepare-official-plugins.py

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify the Gradle wrapper
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          actual = hashlib.sha256(Path('gradle/wrapper/gradle-wrapper.jar').read_bytes()).hexdigest()
          assert actual == '7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d', actual
          PY
      - name: Install compile SDK in the runner SDK
        run: |
          sdkmanager_path="${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_path"
          "$sdkmanager_path" 'platforms;android-37.2' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
      - name: Build both native ABIs and offline dictionaries
        run: python3 scripts/build-engine.py
      - name: Run real Android x86_64 engine and learning contracts
        run: |
          set -o pipefail
          python3 scripts/test-linux-native.py 2>&1 | tee .native/engine-contract.log
      - name: Test Buffer and keyboard layouts, build development APK and run Lint
        run: ./gradlew --no-daemon :core:test :app:assembleDebug :app:lintDebug :app:assembleDebugAndroidTest :testhost:assembleDebug :testhost:assembleDebugAndroidTest :testhost:lintDebug
      - name: Compile the 1.0 release configuration without publishing
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease :app:lintRelease
      - name: Verify release APK alignment
        run: "$ANDROID_HOME/build-tools/36.0.0/zipalign -c -P 16 -v 4 app/build/outputs/apk/release/app-release-unsigned.apk"
      - name: Verify packaged offline translation dictionary
        run: python3 resources/dictionary/verify-dictionary.py --check --apk app/build/outputs/apk/debug/app-debug.apk
      - name: Verify APK 16 KB alignment
        run: "$ANDROID_HOME/build-tools/36.0.0/zipalign -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk"
      - name: Upload development APK and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RIMES-Android-DEV-${{ github.sha }}
          path: |
            platforms/android/app/build/outputs/apk/debug/*.apk
            platforms/android/app/build/reports/lint-results-debug.*
            platforms/android/core/build/test-results/test/
            platforms/android/testhost/build/reports/lint-results-debug.*
            platforms/android/app/build/generated/rime/build-receipt.json
            platforms/android/app/build/generated/rime/assets/rime/manifest.json
            platforms/android/.native/engine-contract.log
          retention-days: 14
          if-no-files-found: warn
      # No publishing, production signing keys, device install or macOS release gate.

      - name: Upload unsigned release preparation artifacts
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RIMES-Android-UNSIGNED-release-check-${{ github.sha }}
          path: |
            platforms/android/app/build/outputs/apk/release/*unsigned.apk
            platforms/android/app/build/outputs/bundle/release/*.aab
            platforms/android/app/build/reports/lint-results-release.*
          retention-days: 14
