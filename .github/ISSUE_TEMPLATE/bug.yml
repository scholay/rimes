name: Bug report
description: 报告可复现的 RIMES 输入、Buffer、候选窗、设置或安装问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请勿粘贴输入正文、剪贴板内容、API 密钥、token 或未脱敏的用户路径。
  - type: input
    id: version
    attributes:
      label: RIMES 版本或 commit
      placeholder: 例如 v0.4.3 或 git SHA
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 与硬件
      placeholder: 例如 macOS 15.6 / Apple Silicon
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: 宿主应用与版本
      placeholder: 例如 Codex、Notes、Obsidian、Chrome
    validations:
      required: true
  - type: input
    id: scheme
    attributes:
      label: 输入方案与并击扩展状态
      placeholder: 例如小鹤双拼；并击扩展关闭
    validations:
      required: true
  - type: input
    id: buffer
    attributes:
      label: Buffer / 剪贴板状态
      placeholder: Buffer 开启；实时翻译；剪贴板历史关闭
    validations:
      required: true
  - type: input
    id: display
    attributes:
      label: Spaces、全屏与显示器
      placeholder: 单屏/双屏，是否跨 Space 或全屏
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 最短复现步骤
      placeholder: |
        1. 打开……
        2. 切换……
        3. 输入……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏日志、截图或录屏
      description: 请说明证据来自真实安装、源码 smoke 还是设计原型。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除输入正文、剪贴板内容、密钥、token 和敏感路径。
          required: true
