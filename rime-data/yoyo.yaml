寒梅: # 192指法
  __append:
    # 左右手区按键的镜像转换（标准 QWERTY 对称）：
    # 右手 p o i u y ; l k j h / . , m n 分别对应左手 q w e r t a s d f g z x c v b。
    # 即左手按 qw 对应右手按 po、左手按 sef 对应右手按 jil；
    # 每个码元左右手都能打出（左右手经 chord 排序后的顺序差异由双规则覆盖）。
    # 本方案不使用 0-9 与 - = [ ] 键；直列键盘人体工程：同排/相近排优先、无同列三键、少用小指。
